name: Google Video Search - FlashData
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Create a video tutorial shortlist across websites for a research workflow.
        id: data
        uses: rocosen/flashdata-google-videos-action@v0.1.0
        with:
          api-key: ${{ secrets.FLASHDATA_API_KEY }}
          query: database indexing tutorial
          options-json: '{"num":5}'
      - name: Save data for the next pipeline stage
        uses: actions/upload-artifact@v4
        with:
          name: google-videos
          path: ${{ steps.data.outputs.artifact-directory }}
          retention-days: 7
